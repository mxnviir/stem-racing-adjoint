          git commit -q -m "Normal adjoint test on the wall-resolved mesh: results (distributed, GitHub Actions)" || echo "nothing to commit"
          ok=0
          for i in 1 2 3 4; do git pull -q --no-rebase --no-edit origin "$BRANCH" 2>/dev/null; \
            if git push -q; then ok=1; break; fi; sleep $((2 ** i)); done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
