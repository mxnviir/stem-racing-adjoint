name: tests
# The car builder's and the searches' tests, split across parallel machines.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: car/body/tests, shard: 0, of: 4 }
          - { dir: car/body/tests, shard: 1, of: 4 }
          - { dir: car/body/tests, shard: 2, of: 4 }
          - { dir: car/body/tests, shard: 3, of: 4 }
          - { dir: car/race/tests, shard: 0, of: 1 }
          - { dir: car/parts/tests, shard: 0, of: 1 }
          - { dir: car/build/tests, shard: 0, of: 1 }
          - { dir: search/sidepod, shard: 0, of: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Libraries the remesher needs
        run: (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done) && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
      - run: pip install -r requirements.txt
      - name: pytest
        run: |
          files=$(ls ${{ matrix.dir }}/test_*.py | awk -v s=${{ matrix.shard }} -v n=${{ matrix.of }} 'NR % n == s')
          python -m pytest $files -q --tb=short
