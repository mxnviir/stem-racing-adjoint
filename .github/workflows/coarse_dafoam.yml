name: coarse_dafoam
run-name: "Coarse-mesh DAFoam gradient on a runner (hybrid)"

# hybrid/HYBRID_TEST.md: fresh DAFoam drag gradients on GitHub runners for the evolution + adjoint loop. One job
# per design: coarse fresh mesh + steady upwind state (gate.py's own pipeline), then DAFoam (Krylov, PC fill 0, level 1,
# as the validated coarse gradient) in its Docker image, 16 GB swap. "base" reproduces the stored gradient
# (gate_results_coarse_up/dafoam) as the smoke test. Launch: commit .github/coarse_dafoam_request.json.
on:
  push:
    branches: [claude/dazzling-ritchie-3q792g]
    paths: [".github/coarse_dafoam_request.json"]

permissions: { contents: write, actions: read }

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 numba cadquery-ocp
  GH_TOKEN: ${{ github.token }}
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"

jobs:
  init:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.r.outputs.cases }}
      bumpgeom_run: ${{ steps.r.outputs.bumpgeom_run }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('.github/coarse_dafoam_request.json'))
          print('cases=' + json.dumps(r['cases'])); print('bumpgeom_run=' + str(r['bumpgeom_run']))
          PY

  grad:
    name: "dafoam ${{ matrix.case.name }}"
    needs: init
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.init.outputs.cases) }}
    steps:
      - name: room (free disk, 16 GB swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -g; df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: OpenFOAM v2412 + python deps + DAFoam image
        timeout-minutes: 40
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
          for i in 1 2 3 4 5 6; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4 5; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sleep 30; done
          pip install $PY_DEPS
          for i in 1 2 3; do docker pull dafoam/opt-packages:v5.1.1 && break; sleep 30; done
      - name: car geometry (exact CAD export + the bump geometry's remeshed base)
        working-directory: research/sidepod_opt
        run: |
          gh run download "${{ needs.init.outputs.bumpgeom_run }}" -R "${{ github.repository }}" -n bumpgeom -D /tmp/bg
          tar xzf /tmp/bg/bumpgeom.tgz -C .
          ls gate | head -30
          [ -f gate/original/car_half.stl ] || python -W ignore -c "
          from pathlib import Path; from geometry import Car
          c = Car(); c.export_car_folder(c.body_mesh, Path('gate/original'), 'original')"
      - name: design folder
        working-directory: research/sidepod_opt
        run: |
          if [ "${{ matrix.case.field }}" = "base" ]; then echo "DESIGN=gate/original" >> "$GITHUB_ENV"; else
            GATE_RES=resolved GATE_RESULTS=/tmp/gr python -W ignore esi/make_step.py "${{ matrix.case.name }}" "${{ matrix.case.field }}" "${{ matrix.case.amp }}"
            echo "DESIGN=gate/bump_${{ matrix.case.name }}" >> "$GITHUB_ENV"; fi
      - name: coarse steady state (fresh mesh, upwind)
        working-directory: research/sidepod_opt
        timeout-minutes: 150
        run: |
          mkdir -p ../../out
          GATE_RES=coarse GATE_RESULTS=/tmp/gr CFD_DIV_U="bounded Gauss upwind" \
            python -W ignore -u hybrid/coarse_state.py "$DESIGN" gate/refA_hyb "${{ matrix.case.iters || 5000 }}" ../../out/state.json 2>&1 | tail -5
      - name: DAFoam primal + adjoint
        working-directory: research/sidepod_opt
        timeout-minutes: 180
        run: |
          python dafoam/make_case.py --src gate/refA_hyb --out gate/dafoam_case --iters 300 | tail -1
          env DAF_ADJ=Krylov DAF_PC_FILL=0 DAF_PC_LEVEL=1 DAF_GMRES_ITERS=2000 DAF_GMRES_RESTART=200 \
            dafoam/run_docker.sh gate/dafoam_case 4 > ../../out/dafoam.out 2>&1 || true
          grep -E "DAFOAM|Killed|Maximum resident" ../../out/dafoam.out || tail -30 ../../out/dafoam.out
          cp gate/dafoam_case/dafoam_sens.npz gate/dafoam_case/dafoam_sens.json ../../out/ 2>/dev/null || true
          free -g
      - name: compare with the stored coarse gradient
        if: always()
        working-directory: research/sidepod_opt
        run: |
          [ -f ../../out/dafoam_sens.npz ] && GATE_RES=resolved GATE_RESULTS=/tmp/gr python -W ignore hybrid/compare_gradients.py \
            ../../out/dafoam_sens.npz gate_results_coarse_up/dafoam/dafoam_sens.npz ../../out/compare.json || echo "no gradient"
          { echo "## ${{ matrix.case.name }}"; cat ../../out/state.json 2>/dev/null | head -c 400; echo; grep -E "DAFOAM" ../../out/dafoam.out; cat ../../out/compare.json 2>/dev/null | head -c 600; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "daf-${{ matrix.case.name }}", path: out/, retention-days: 30 }

  collect:
    needs: grad
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/dazzling-ritchie-3q792g, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "daf-*", path: /tmp/daf }
      - name: commit the gradients
        run: |
          D=research/sidepod_opt/hybrid/dafoam_actions/${{ github.run_id }}
          mkdir -p $D && cp -r /tmp/daf/. $D/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/sidepod_opt/hybrid/dafoam_actions
          git commit -m "coarse_dafoam: results of run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin claude/dazzling-ritchie-3q792g && git push origin HEAD:claude/dazzling-ritchie-3q792g && break; sleep $((i*10)); done
