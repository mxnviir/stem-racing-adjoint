name: seedevo_gate_retry
run-name: "Seed evolution: TR retry (${{ github.event_name }})"

# SEED_EVOLUTION_PLAN.md, TR amendment: a design whose coarse DAFoam adjoint failed gets one retry with more GMRES
# iterations; then its along/against-DAFoam probes run on the frame-0 steady state kept by the gate run.
# Launch: commit .github/seedevo_gate_retry_request.json
#   {"stage": "dafoam", "designs": ["slots"], "gmres_iters": 5000}
#   {"stage": "probe", "designs": ["slots"], "state_run": <gate run id>, "daf_run": <retry run id>, "moves": {...}}
on:
  push:
    branches: [claude/loving-keller-q72mvv]
    paths: [".github/seedevo_gate_retry_request.json"]

permissions: { contents: write, actions: read }

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 numba cadquery-ocp
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

jobs:
  init:
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.r.outputs.stage }}
      designs: ${{ steps.r.outputs.designs }}
      probes: ${{ steps.r.outputs.probes }}
      iters: ${{ steps.r.outputs.iters }}
      state_run: ${{ steps.r.outputs.state_run }}
      daf_run: ${{ steps.r.outputs.daf_run }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('.github/seedevo_gate_retry_request.json'))
          print('stage=' + r['stage']); print('designs=' + json.dumps(r['designs']))
          print('probes=' + json.dumps([{"design": d, "move": m, "field": f} for d in r['designs'] for m, f in r.get('moves', {}).items()] or [{"design": "-", "move": "-", "field": "-"}]))
          print('iters=' + str(r.get('gmres_iters', 5000))); print('state_run=' + str(r.get('state_run', ''))); print('daf_run=' + str(r.get('daf_run', '')))
          PY

  dafoam:
    name: "dafoam retry ${{ matrix.design }}"
    needs: init
    if: needs.init.outputs.stage == 'dafoam'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        design: ${{ fromJSON(needs.init.outputs.designs) }}
    steps:
      - name: room (free disk, 16 GB swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: OpenFOAM v2412 + python deps + DAFoam image
        timeout-minutes: 40
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
          for i in 1 2 3 4 5 6; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4 5 6 7 8; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sudo apt-get clean; sleep 60; done; test -f /usr/lib/openfoam/openfoam2412/etc/bashrc || { echo "OpenFOAM install failed"; exit 1; }
          pip install $PY_DEPS
          for i in 1 2 3; do docker pull dafoam/opt-packages:v5.1.1 && break; sleep 30; done
      - name: coarse steady state + DAFoam adjoint (more GMRES iterations)
        working-directory: research/sidepod_opt
        timeout-minutes: 290
        run: |
          D=${{ matrix.design }}; mkdir -p ../../out/daf-$D
          tar xzf seedevo/designs/$D.tgz -C seedevo/designs
          GATE_RES=coarse GATE_RESULTS=/tmp/gr CFD_DIV_U="bounded Gauss upwind" \
            python -W ignore -u hybrid/coarse_state.py seedevo/designs/$D/car gate/refA_hyb 5000 ../../out/daf-$D/state.json 2>&1 | tail -3
          python dafoam/make_case.py --src gate/refA_hyb --out gate/dafoam_case --iters 300 | tail -1
          env DAF_ADJ=Krylov DAF_PC_FILL=0 DAF_PC_LEVEL=1 DAF_GMRES_ITERS=${{ needs.init.outputs.iters }} DAF_GMRES_RESTART=200 \
            dafoam/run_docker.sh gate/dafoam_case 4 > ../../out/daf-$D/dafoam.out 2>&1 || true
          grep -E "DAFOAM|Killed|Completed" ../../out/daf-$D/dafoam.out || tail -30 ../../out/daf-$D/dafoam.out
          cp gate/dafoam_case/dafoam_sens.npz gate/dafoam_case/dafoam_sens.json ../../out/daf-$D/ 2>/dev/null || true
          test -f ../../out/daf-$D/dafoam_sens.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "daf-${{ matrix.design }}", path: out/, retention-days: 30 }

  probe:
    name: "probe ${{ matrix.case.design }} ${{ matrix.case.move }}"
    needs: init
    if: needs.init.outputs.stage == 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.init.outputs.probes) }}
    steps:
      - name: room (free disk, 10 GB swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: OpenFOAM v2412 + python deps
        timeout-minutes: 30
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
          for i in 1 2 3 4 5 6; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4 5 6 7 8; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sudo apt-get clean; sleep 60; done; test -f /usr/lib/openfoam/openfoam2412/etc/bashrc || { echo "OpenFOAM install failed"; exit 1; }
          pip install $PY_DEPS
      - uses: actions/download-artifact@v4
        with: { name: "state-${{ matrix.case.design }}", path: /tmp/st, run-id: "${{ needs.init.outputs.state_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: "daf-${{ matrix.case.design }}", path: /tmp/daf, run-id: "${{ needs.init.outputs.daf_run }}", github-token: "${{ github.token }}" }
      - name: the move, then the morphed steady solve
        working-directory: research/sidepod_opt
        timeout-minutes: 250
        run: |
          D=${{ matrix.case.design }}; NAME=${D}_${{ matrix.case.move }}; FIELD="${{ matrix.case.field }}"
          mkdir -p gate ../../out/probe/$NAME gr
          tar xzf seedevo/designs/$D.tgz -C seedevo/designs
          tar xzf /tmp/st/state.tgz -C gate
          mkdir -p seedevo/probe_daf && cp /tmp/daf/daf-$D/dafoam_sens.npz seedevo/probe_daf/$D.npz
          FIELD=${FIELD//@DAF/seedevo\/probe_daf\/$D.npz}
          python3 -c "import json,pathlib; pathlib.Path('gr/base.json').write_text(json.dumps({'run_dir_kept': str(pathlib.Path('gate/state_steady').resolve())}))"
          GATE_RES=resolved GATE_RESULTS=$PWD/gr STEP_NORMAL_SIGMA_MM=1.5 STEP_ZMIN_MM=1.5 \
            python -W ignore -m seedevo.probe_step seedevo/designs/$D/car "$NAME" "$FIELD" 0.5 | tail -1 | tee ../../out/probe/$NAME/step_info.txt
          export GATE_RES=resolved GATE_RESULTS=$PWD/gr GATE_ITERS=1000 GATE_TIMEOUT=14000 CFD_DIV_U="bounded Gauss upwind" \
                 GATE_WALL_RESOLVED=1 P2_MORPH_STRICT=1 P2_WARM_COPY=1 P2_MORPH_FIELD=$PWD/gate/bump_$NAME/morph_field.npz \
                 P2_MORPH_EXPLICIT=1 P2_MORPH_D0_MM=0.5 P2_MORPH_DELTA_MM=5 P2_MORPH_STRICT_RULE=acceptable
          set +e
          python -W ignore -u gate.py bump "$NAME" 4 > ../../out/probe/$NAME/bump.log 2>&1
          RC=$?
          set -e
          grep -h "morph checkMesh" ../../out/probe/$NAME/bump.log || true; tail -2 ../../out/probe/$NAME/bump.log | cut -c1-400
          cp gr/bump_$NAME.json ../../out/probe/$NAME/ 2>/dev/null || true
          cp -r gr/forces/bump_$NAME ../../out/probe/$NAME/forces 2>/dev/null || true
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "probe-${{ matrix.case.design }}-${{ matrix.case.move }}", path: out/, retention-days: 30 }

  collect:
    needs: [init, dafoam, probe]
    if: always() && needs.init.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "daf-*", path: /tmp/r/daf }
      - uses: actions/download-artifact@v4
        with: { pattern: "probe-*", path: /tmp/r/probe }
      - name: commit the results
        run: |
          D=research/sidepod_opt/seedevo/results/gate_retry_${{ github.run_id }}
          mkdir -p $D && cp -r /tmp/r/. $D/ 2>/dev/null || true
          find $D -name "*.out" -size +2M -exec sh -c 'tail -c 2000000 "$1" > "$1.t" && mv "$1.t" "$1"' _ {} \;
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $D
          git commit -m "seedevo gate retry (${{ needs.init.outputs.stage }}): results of run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*10)); done
