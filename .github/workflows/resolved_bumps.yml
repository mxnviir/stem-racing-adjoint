name: resolved_bumps
run-name: "Wall-resolved morph solves (bumps or step-test candidates)"

# RESOLVED_TEST.md amendment 2026-11-24 (plan B step 2, DECISIONS.md D9): the six bumps at the heights that morph
# clean, one runner per bump in parallel: morph the tested wall-resolved mesh (strict, fixed reference), warm-start
# from the Kaggle steady state, 1000 steady (upwind) iterations. The adjoints are reused. Results are committed to
# gate_results_resolved_up/. Launch: commit .github/resolved_bumps_request.json.
on:
  push:
    branches: [claude/dazzling-ritchie-3q792g]
    paths: [".github/resolved_bumps_request.json"]

permissions: { contents: write, actions: read }

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 numba cadquery-ocp
  GH_TOKEN: ${{ github.token }}
  OMPI_MCA_rmaps_base_oversubscribe: "1"   # 4 vCPU = 2 cores x 2 threads; Open MPI counts cores (as in resolved_adjoint.yml)

jobs:
  init:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.r.outputs.cases }}
      steady_release: ${{ steps.r.outputs.steady_release }}
      bumpgeom_run: ${{ steps.r.outputs.bumpgeom_run }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('.github/resolved_bumps_request.json'))
          print('cases=' + json.dumps(r['cases']))
          print('steady_release=' + r['steady_release'])
          print('bumpgeom_run=' + str(r['bumpgeom_run']))
          PY

  check:
    name: "bump ${{ matrix.case.name }}"
    needs: init
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case: ${{ fromJSON(needs.init.outputs.cases) }}
    steps:
      - name: room (free disk, 10 GB swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: OpenFOAM v2412 + python deps
        timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
          for i in 1 2 3 4 5 6; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4 5; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sleep 30; done
          test -d /usr/lib/openfoam/openfoam2412/tutorials
          pip install $PY_DEPS
      - name: tested mesh (steady state) + bump geometry
        run: |
          gh release download "${{ needs.init.outputs.steady_release }}" -R "${{ github.repository }}" -p 'steadystate.tgz.part*' -D /tmp/ss
          cat /tmp/ss/steadystate.tgz.part* | tar xz -C research/sidepod_opt && rm -rf /tmp/ss
          D=research/sidepod_opt/gate/refA_resolved_up
          for t in $(ls "$D" | grep -E '^[0-9]+$' | sort -n -r); do
            if [ -f "$D/$t/polyMesh/points" ]; then cp "$D/$t/polyMesh/points" "$D/constant/polyMesh/points"; echo "constant/polyMesh/points <- $t/polyMesh/points"; break; fi
          done
          gh run download "${{ needs.init.outputs.bumpgeom_run }}" -R "${{ github.repository }}" -n bumpgeom -D /tmp/bg
          tar xzf /tmp/bg/bumpgeom.tgz -C research/sidepod_opt
          cd research/sidepod_opt && python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('gate_results_resolved_up/base.json'); d = json.loads(p.read_text())
          d['run_dir_kept'] = str(pathlib.Path('gate/refA_resolved_up').resolve()); p.write_text(json.dumps(d, indent=1))
          PY
      - name: step candidate (esi/STEP_TEST.md)
        if: matrix.case.field
        working-directory: research/sidepod_opt
        env:
          STEP_EDGE_MASK_MM: ${{ matrix.case.mask || '0' }}
          STEP_NORMAL_SIGMA_MM: ${{ matrix.case.nsig || '0' }}
          STEP_ZMIN_MM: ${{ matrix.case.zmin || '0' }}
        run: |
          GATE_RES=resolved GATE_RESULTS=$PWD/gate_results_resolved_up python -W ignore esi/make_step.py \
            "${{ matrix.case.name }}" "${{ matrix.case.field }}" "${{ matrix.case.amp }}"
      - name: bump variant (other height or site)
        if: matrix.case.amp != '' && !matrix.case.field
        working-directory: research/sidepod_opt
        run: |
          GATE_RES=resolved GATE_RESULTS=$PWD/gate_results_resolved_up python -W ignore gate.py variant \
            "${{ matrix.case.name }}" "${{ matrix.case.site }}" "${{ matrix.case.amp }}"
      - name: solve (morph strict, warm start, 1000 steady iterations)
        working-directory: research/sidepod_opt
        timeout-minutes: 320
        run: |
          export GATE_RES=resolved GATE_RESULTS=$PWD/gate_results_resolved_up GATE_ITERS=1000 GATE_TIMEOUT=18000 \
                 CFD_DIV_U="bounded Gauss upwind" GATE_WALL_RESOLVED=1 GATE_MORPH_REF_RM=1 P2_MORPH_STRICT=1 P2_WARM_COPY=1
          if [ "${{ matrix.case.direct }}" = "1" ]; then export P2_MORPH_FIELD=$PWD/gate/bump_${{ matrix.case.name }}/morph_field.npz; echo "direct-field morph: $P2_MORPH_FIELD"; fi
          if [ "${{ matrix.case.explicit }}" = "1" ]; then export P2_MORPH_EXPLICIT=1 P2_MORPH_D0_MM=${{ matrix.case.d0 || '0.5' }} P2_MORPH_DELTA_MM=${{ matrix.case.delta || '5' }}; export P2_MORPH_STRICT_RULE=acceptable; echo "explicit morph (strict rule: acceptable)"; fi
          T0=$(date +%s)
          set +e
          python -W ignore -u gate.py bump "${{ matrix.case.name }}" 4 > gate/bump_link.log 2>&1
          RC=$?
          set -e
          echo "rc $RC, $(( ($(date +%s) - T0) / 60 )) min"
          grep -h "morph checkMesh" gate/bump_link.log || true
          tail -3 gate/bump_link.log | cut -c1-400
          mkdir -p ../../out/gate_results_resolved_up/forces
          cp gate_results_resolved_up/bump_"${{ matrix.case.name }}".json ../../out/gate_results_resolved_up/ 2>/dev/null || true
          cp -r gate_results_resolved_up/forces/bump_"${{ matrix.case.name }}" ../../out/gate_results_resolved_up/forces/ 2>/dev/null || true
          mkdir -p ../../out/logs && cp gate/bump_link.log ../../out/logs/bump_"${{ matrix.case.name }}".log
          if [ "$RC" != 0 ]; then   # failed run: its solver logs and what the warm start read
            K=$(ls -dt ../../part2-simulation/cfd_case_template/runs/*/ 2>/dev/null | head -1)
            [ -n "$K" ] && for f in "$K"logs/*.log; do cp "$f" ../../out/logs/"${{ matrix.case.name }}"_$(basename "$f"); done
            { echo "== state times"; ls gate/refA_resolved_up; L=$(ls gate/refA_resolved_up | grep -E '^[0-9.]+$' | sort -g | tail -1);
              echo "== latest $L"; ls -la gate/refA_resolved_up/$L; echo "== run 0/"; ls -la "$K"0;
              for f in U p nut k omega; do echo "== $f types (run 0)"; grep -a -E '^\s+type' "$K"0/$f 2>/dev/null | sort | uniq -c; done
              echo "== solver.log tail"; tail -60 "$K"logs/solver.log; } > ../../out/logs/"${{ matrix.case.name }}"_diag.txt 2>&1
            tail -80 ../../out/logs/"${{ matrix.case.name }}"_diag.txt
          fi
          { echo "## ${{ matrix.case.name }}: rc $RC"; grep -h "morph checkMesh" gate/bump_link.log;
            cat gate_results_resolved_up/bump_"${{ matrix.case.name }}".json 2>/dev/null | head -c 600; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "bump-${{ matrix.case.name }}", path: out/, retention-days: 14 }

  collect:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/dazzling-ritchie-3q792g, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "bump-*", merge-multiple: true, path: /tmp/bumps }
      - name: commit the bump results
        run: |
          D=research/sidepod_opt
          mkdir -p $D/gate_results_resolved_up $D/esi/resolved_bumps_logs
          cp -r /tmp/bumps/gate_results_resolved_up/. $D/gate_results_resolved_up/ 2>/dev/null || true
          cp /tmp/bumps/logs/*.log $D/esi/resolved_bumps_logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $D/gate_results_resolved_up $D/esi/resolved_bumps_logs
          git commit -m "resolved_bumps: results of run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin claude/dazzling-ritchie-3q792g && git push origin HEAD:claude/dazzling-ritchie-3q792g && break; sleep $((i*10)); done
