name: seedevo_plumbing
run-name: "Seed evolution: plumbing test TP on coarse CFD (SEED_EVOLUTION_PLAN.md)"

# research/sidepod_opt/seedevo/SEED_EVOLUTION_PLAN.md, test TP: the whole chain (census, crossover and mutation
# children, the ESI adjoint's refinement on two elites, morph scoring) on real coarse CFD, one runner, steady
# model. Plumbing only: no design conclusion from the coarse mesh (DECISIONS D6).
# Launch: commit .github/seedevo_request.json on this branch, or run it by hand.
on:
  push:
    branches: [claude/loving-keller-q72mvv]
    paths: [".github/seedevo_request.json"]
  workflow_dispatch:

permissions: { contents: write }

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 numba cadquery-ocp
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

jobs:
  plumbing:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: room (free disk, 8 GB swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -g; df -h / | tail -1; nproc
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/ofdebs, key: openfoam2412-260127-noble-debs }
      - name: OpenFOAM v2412 + python deps
        timeout-minutes: 40
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; sleep 20; done) || true
          for i in 1 2 3 4 5 6; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          bash .github/scripts/install_openfoam.sh
          pip install $PY_DEPS
      - name: plumbing test TP
        working-directory: research/sidepod_opt
        timeout-minutes: 290
        run: |
          mkdir -p ../../out
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          set +e
          GATE_RES=coarse GATE_RESULTS=/tmp/gr CFD_DIV_U="bounded Gauss upwind" \
            python -W ignore -u -m seedevo.run_plumbing /tmp/plumb ../../out/tp_result.json 2>&1 \
            | grep -v -E "Qt Plugin|Cannot load library|^$" | tee ../../out/tp.log | grep -E "CALL|CENSUS|EXPLORE|REFINE|MARKS|Error|Traceback"
          RC=${PIPESTATUS[0]}
          cp /tmp/plumb/calls.jsonl ../../out/ 2>/dev/null
          mkdir -p ../../out/designs && for d in /tmp/plumb/d*/; do n=$(basename $d); mkdir -p ../../out/designs/$n; cp $d/car/car_half.stl $d/car/mass_report.json ../../out/designs/$n/ 2>/dev/null; done
          mkdir -p ../../out/adjoint && cp -r /tmp/plumb/adjoint/*/esi_sens.* ../../out/adjoint/ 2>/dev/null
          { echo "## TP"; grep -E "MARKS" ../../out/tp.log; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: seedevo-plumbing, path: out/, retention-days: 30 }
      - name: commit the results
        if: always()
        run: |
          D=research/sidepod_opt/seedevo/results/plumbing_${{ github.run_id }}
          mkdir -p $D && cp out/tp_result.json out/calls.jsonl out/tp.log $D/ 2>/dev/null; cp -r out/designs out/adjoint $D/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/sidepod_opt/seedevo/results
          git commit -m "seedevo plumbing: results of run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*10)); done
